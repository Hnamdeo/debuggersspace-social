<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;font-family:Inter,sans-serif;background:#E6F3F0;color:#1E3240;position:relative;overflow:hidden}
.blob{position:absolute;border-radius:50%}
.b1{width:520px;height:520px;background:#FFC23D;opacity:.35;top:-160px;right:-140px}
.b2{width:420px;height:420px;background:#3E95D8;opacity:.18;bottom:-120px;left:-120px}
.b3{width:180px;height:180px;background:#F2704E;opacity:.25;top:520px;left:-60px}
.wrap{position:relative;padding:90px 80px;height:100%;display:flex;flex-direction:column}
.pill{align-self:flex-start;background:#1E3240;color:#fff;font-weight:800;font-size:30px;padding:16px 30px;border-radius:999px;letter-spacing:.5px}
h1{font-size:118px;font-weight:900;line-height:1.0;margin-top:44px;letter-spacing:-2px}
h1 span{color:#F2704E}
.tag{font-size:40px;font-weight:700;color:#587080;margin-top:22px}
.chick{position:absolute;right:60px;top:500px}
.chips{display:flex;flex-wrap:wrap;gap:16px;margin-top:auto;max-width:900px}
.chip{background:#fff;border:3px solid #CFE3DE;border-radius:22px;padding:16px 24px;font-size:30px;font-weight:700}
.chip i{font-style:normal;color:#2FA36B}
.foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:46px}
.store{background:#2FA36B;color:#fff;border-radius:26px;padding:26px 36px;font-size:40px;font-weight:900;line-height:1.1}
.store small{display:block;font-size:24px;font-weight:600;opacity:.9}
.url{font-size:34px;font-weight:800;text-align:right}
.url small{display:block;font-size:24px;color:#587080;font-weight:600}
.stars{position:absolute;font-size:60px;color:#FFC23D}
</style></head><body>
