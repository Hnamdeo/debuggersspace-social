<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1350px;font-family:Inter,sans-serif;background:radial-gradient(1200px 900px at 85% 10%,#1e3a8a 0%,#0b1a33 55%);color:#fff;overflow:hidden;position:relative}
.glow{position:absolute;width:700px;height:700px;border-radius:50%;background:radial-gradient(#06b6d4 0%,transparent 65%);opacity:.25;right:-200px;bottom:-150px}
.wrap{position:relative;padding:90px 80px;height:100%;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:22px;font-size:34px;font-weight:800}
.brand img{width:84px;height:84px;border-radius:18px}
.pill{margin-top:150px;align-self:flex-start;border:3px solid #00d1ff;color:#00d1ff;font-weight:800;font-size:32px;padding:14px 30px;border-radius:999px;letter-spacing:3px}
h1{font-size:120px;font-weight:900;line-height:1.02;margin-top:40px;letter-spacing:-2px}
h1 span{background:linear-gradient(90deg,#818cf8,#06b6d4);-webkit-background-clip:text;color:transparent}
p{font-size:42px;font-weight:600;color:#b9c6dd;margin-top:36px;line-height:1.35}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:30px;color:#b9c6dd;font-weight:600}
.foot b{color:#fff;font-size:44px;font-weight:900;display:block}
.dots{display:flex;gap:16px}.dots i{width:22px;height:22px;border-radius:50%;background:#00d1ff;opacity:.35}.dots i:first-child{opacity:1}
</style></head><body><div class="glow"></div><div class="wrap">
<div class="brand"><img src="dslogo.png">Debuggers Space</div>
<div class="pill">COMING SOON</div>
<h1>Our new<br>product is<br><span>for kids.</span></h1>
<p>A learning games app for little ones,<br>built by our team.</p>
<div class="foot"><div><b>Launching soon</b>Stay tuned</div><div class="dots"><i></i><i></i><i></i></div></div>
</div></body></html>
